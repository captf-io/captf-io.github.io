# captf.io, built with Zensical: the landing page, the documentation at
# /docs/ and the blog at /blog/. Build with `make build`, preview with
# `make serve`; `make help` for more.

[project]
site_name = "Cluster API Terraform"
site_description = "Cluster API Provider Terraform. Your modules are the provider."
site_url = "https://captf.io/"
repo_url = "https://github.com/captf-io/captf-io.github.io"
repo_name = "captf-io/captf-io.github.io"
# Pages are Markdown under docs/; edit and view links open the page there.
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; The CAPTF Authors. Apache-2.0."
site_dir = "site"
extra_css = ["assets/stylesheets/extra.css"]
# Break points in long identifiers in table cells (see the file).
extra_javascript = ["assets/javascripts/tables.js", "assets/javascripts/sitenav.js", "assets/javascripts/doctabs.js"]

