  { "blog/posts/2026-09-29-the-captf-book.md" = "The CAPTF documentation is published at captf.io/docs: concepts, guides, the module contract, runbooks and generated reference." },
]
# END llmstxt sections

# Click an image to view it full size.
[project.plugins.glightbox]

# GitHub-style "> [!NOTE]" callouts render as admonitions.
[project.plugins.callouts]

# [Heading text][] links to any heading in the book by its anchor.
[project.plugins.autorefs]

[project.plugins.minify]
minify_html = true

# Markdown ----------------------------------------------------------------

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
smarty = {}
tables = {}
toc.permalink = true
# GitHub-style anchors, as mdBook made them: "--runner-image" keeps its
# leading hyphens, so the book's existing #fragments resolve.
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.mark = {}
pymdownx.tilde = {}
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
# Every page gets the acronyms in includes/abbreviations.md as tooltips.
pymdownx.snippets.base_path = ["docs/docs", "."]
pymdownx.snippets.check_paths = true
pymdownx.snippets.auto_append = ["includes/abbreviations.md"]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
