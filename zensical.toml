# Plugins -----------------------------------------------------------------

[project.plugins.search]

# Directory defaults from docs/**/.meta.yml (tags per section).
[project.plugins.meta]

[project.plugins.tags]

# News at /blog/: posts in docs/blog/posts/, authors in docs/blog/.authors.yml.
[project.plugins.blog]
blog_dir = "blog"
post_date_format = "long"
post_url_format = "{date}/{slug}"
post_readtime = true
post_excerpt = "required"
archive = true
categories = true
pagination_per_page = 10

# /feed_rss_created.xml and /feed_json_created.json for the blog posts.
[project.plugins.rss]
match_path = "blog/posts/.*"
date_from_meta = { as_creation = "date" }
categories = ["categories"]
feed_title = "Cluster API Terraform"
feed_description = "News from the CAPTF project: new modules, releases and changes to the module contract."
image = "https://captf.io/assets/landing/og.jpg"
use_git = false

# A social preview card per page; overrides/main.html adds the og: tags.
[project.plugins.social]
cards_layout_options = { background_color = "#0A0D1C", color = "#E7E9F5" }

# /llms.txt, /llms-full.txt and a Markdown copy of every page, for LLM
# tools (https://llmstxt.org). The sections are generated from the nav and
# each page's description by tools/gen_llms.py.
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = """
CAPTF (Cluster API Provider Terraform) is a Cluster API infrastructure provider. Instead of \
cloud-specific Go controllers, it provisions cluster infrastructure by running Terraform or OpenTofu \
modules, packaged as OCI images, as Kubernetes Jobs: "your modules are the provider".

How it works: Cluster API's `Cluster`, `Machine` and `MachinePool` reference CAPTF's \
`TerraformCluster`, `TerraformMachine` and `TerraformMachinePool`. The CAPTF manager renders each \
object's inputs, runs the module image in a runner Job, keeps Terraform state in a Kubernetes Secret \
next to the object, and reads the module's outputs back from that state. A module is written to the \
`v1alpha1` module contract and linted with `tfcapi-lint`.

Status: pre-release. Every kind and the module contract are `v1alpha1`; the contract is frozen for \
implementation but may change. There are no end-to-end tests yet, and the reference cloud modules \
(AWS, Google Cloud, Azure, OCI, OpenStack) have not yet been applied to a real cloud.

