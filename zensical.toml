[project.validation]
nav.omitted_files = "warn"
nav.not_found = "warn"
links.not_found = "warn"
links.anchors = "warn"
links.unrecognized_links = "warn"

# Theme -------------------------------------------------------------------

[project.theme]
custom_dir = "overrides"
logo = "assets/brand/mark.svg"
favicon = "assets/brand/favicon.svg"
language = "en"
font.text = "Inter"
font.code = "JetBrains Mono"
icon.repo = "fontawesome/brands/github"
features = [
  # Navigation
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",              # breadcrumbs above the page title
  # navigation.prune is off on purpose: it leaves inactive sections out of
  # the page, so in the mobile drawer their rows jumped to a page while the
  # active one expanded in place. Every section now expands the same way,
  # for about 11 KB (gzipped) more per docs page.
  "navigation.top",
  "navigation.footer",
  "navigation.tracking",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.instant.prefetch",  # fetch a page on link hover
  "navigation.instant.preview",   # hover a link to preview its target
  "header.autohide",              # header slides away while scrolling down
  "announce.dismiss",             # the pre-release banner can be closed
  # Table of contents and search
  "toc.follow",
  "search.highlight",
  "search.share",
  # Content
  "content.action.edit",          # edit this page on GitHub (edit_uri)
  "content.action.view",          # view this page's raw source
  "content.action.copy",          # copy this page as Markdown
  "content.code.copy",
  "content.code.select",          # select lines, share a link to them
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "content.footnote.tooltips",
]

# Dark only: one palette, the slate scheme, no toggle. A single table (not
# an array) is what tells the theme to render no colour toggle and load no
# scheme-switching script. "custom" picks up the brand colours in
# overrides/assets/stylesheets/extra.css.
[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.extra]
generator = false
# The short name in the header and footer logo lockups; site_name (above)
# is the full name, used in the title bar, link previews and feeds.
brand = "CAPI Terraform"

[project.extra.status]
new = "Recently added"
deprecated = "Deprecated"
encrypted = "Covers sensitive data"

# The top-level nav sections, keyed by title: a Lucide icon, a subtitle
# (at most 34 characters, like the pages' own) and, where the title is too
# long for the compact tab row on narrow windows, a short label. The docs
# tab row (tabs-item.html) and the drawer's top-level rows (nav-item.html)
# both draw from here, so a section looks the same in each.
[project.extra.sections]
"Overview" = { icon = "lucide/compass", subtitle = "What CAPTF is and where to start" }
"User Guide" = { icon = "lucide/book-open", short = "Guide", subtitle = "Run clusters day to day" }
"Cloud Modules" = { icon = "lucide/cloud", short = "Cloud", subtitle = "Five clouds and a no-op set" }
"Module Authors" = { icon = "lucide/package", short = "Authoring", subtitle = "Write and ship a module" }
"Operations" = { icon = "lucide/server-cog", short = "Ops", subtitle = "Install, upgrade and run CAPTF" }
"Troubleshooting" = { icon = "lucide/life-buoy", short = "Troubleshoot", subtitle = "Find the cause of a problem" }
"How It Works" = { icon = "lucide/workflow", short = "Internals", subtitle = "The design behind CAPTF" }
"Reference" = { icon = "lucide/library", subtitle = "Resources, flags, events, metrics" }
"Contributing" = { icon = "lucide/heart-handshake", short = "Contribute", subtitle = "Code, docs, tests and releases" }
"Blog" = { icon = "lucide/newspaper", subtitle = "News from the project" }

# The contract chip at the end of the docs tab row (tabs.html).
