<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">How CAPTF works</title>
  <desc id="d">Write a Terraform or OpenTofu module, package it as an OCI image, CAPTF runs it as Kubernetes Jobs, and Cluster API gets ready clusters, machines and machine pools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0D1C"/>
      <stop offset="1" stop-color="#121735"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A974FF"/>
      <stop offset=".6" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <radialGradient id="dot"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".4" stop-color="#FFD84D"/><stop offset="1" stop-color="#FFD84D" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="330" rx="28"/></clipPath>
    <style>
      .sans { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      @keyframes flow { to { stroke-dashoffset: -40 } }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .wire { stroke-dasharray: 6 14; animation: flow 1.2s linear infinite; }
      .wheel { transform-origin: 750px 120px; animation: spin 14s linear infinite; }
      .n1 { animation: pulse 2.4s ease-in-out infinite; }
      .n2 { animation: pulse 2.4s ease-in-out infinite .4s; }
      .n3 { animation: pulse 2.4s ease-in-out infinite .8s; }
      .n4 { animation: pulse 2.4s ease-in-out infinite 1.2s; }
      .tile { fill: #141A38; stroke: #FFFFFF; stroke-opacity: .1; }
      .step { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #7F89B5; }
      .head { font-size: 20px; font-weight: 700; fill: #FFFFFF; }
      .sub { font-size: 14px; fill: #AAB3D6; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>

    <!-- connectors -->
    <path id="p" d="M210 120H1000" fill="none"/>
    <path class="wire" d="M216 120H384M516 120H684M816 120H984" stroke="url(#wire)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle r="9" fill="url(#dot)">
      <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear"><mpath href="#p"/></animateMotion>
    </circle>

    <!-- 1: module -->
    <rect class="tile" x="90" y="60" width="120" height="120" rx="20" stroke="#A974FF" stroke-opacity=".7"/>
    <text x="150" y="134" class="mono" font-size="34" font-weight="700" fill="#A974FF" text-anchor="middle">.tf</text>

    <!-- 2: image (stacked layers) -->
    <rect class="tile" x="390" y="60" width="120" height="120" rx="20" stroke="#8C7CFF" stroke-opacity=".7"/>
    <g fill="none" stroke-width="3" stroke-linejoin="round">
      <path d="M450 92l34 16-34 16-34-16z" stroke="#FFD84D"/>
      <path d="M416 122l34 16 34-16" stroke="#8C7CFF"/>
      <path d="M416 136l34 16 34-16" stroke="#5B8CFF"/>
    </g>

    <!-- 3: Job wheel -->
    <rect class="tile" x="690" y="60" width="120" height="120" rx="20" stroke="#5B8CFF" stroke-opacity=".8"/>
    <g class="wheel" stroke="#8FB0FF" stroke-width="3" stroke-linecap="round" fill="none">
      <circle cx="750" cy="120" r="32" stroke-width="2.5"/>
      <line x1="750" y1="120" x2="750" y2="88"/>
      <line x1="750" y1="120" x2="775" y2="100"/>
      <line x1="750" y1="120" x2="781.2" y2="127.1"/>
      <line x1="750" y1="120" x2="763.9" y2="148.8"/>
      <line x1="750" y1="120" x2="736.1" y2="148.8"/>
      <line x1="750" y1="120" x2="718.8" y2="127.1"/>
      <line x1="750" y1="120" x2="725" y2="100"/>
    </g>
    <circle cx="750" cy="120" r="8" fill="#5B8CFF"/>

    <!-- 4: cluster -->
    <rect class="tile" x="990" y="60" width="120" height="120" rx="20" stroke="#4ADE80" stroke-opacity=".7"/>
    <g fill="#1E3A7A" stroke="#5B8CFF" stroke-width="1.5">
      <rect class="n1" x="1016" y="86" width="30" height="30" rx="7"/>
      <rect class="n2" x="1054" y="86" width="30" height="30" rx="7"/>
      <rect class="n3" x="1016" y="124" width="30" height="30" rx="7"/>
      <rect class="n4" x="1054" y="124" width="30" height="30" rx="7"/>
    </g>
    <circle cx="1100" cy="70" r="11" fill="#4ADE80"/>
    <path d="M1094.5 70.5l4 4 7-8" fill="none" stroke="#0A0D1C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- captions -->
    <g class="sans" text-anchor="middle">
      <text x="150" y="222" class="step">01 · WRITE</text>
      <text x="150" y="250" class="head">Your module</text>
      <text x="150" y="274" class="sub">Terraform or OpenTofu,</text>
      <text x="150" y="294" class="sub">the code you already have</text>

      <text x="450" y="222" class="step">02 · PACKAGE</text>
      <text x="450" y="250" class="head">An OCI image</text>
      <text x="450" y="274" class="sub">Built on our multi-arch</text>
      <text x="450" y="294" class="sub">OpenTofu or Terraform base</text>

      <text x="750" y="222" class="step">03 · RUN</text>
      <text x="750" y="250" class="head">Kubernetes Jobs</text>
      <text x="750" y="274" class="sub">CAPTF applies, watches</text>
      <text x="750" y="294" class="sub">for drift, and destroys</text>

      <text x="1050" y="222" class="step">04 · SHIP</text>
      <text x="1050" y="250" class="head">A real cluster</text>
      <text x="1050" y="274" class="sub">Cluster API takes it</text>
      <text x="1050" y="294" class="sub">from there</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="329" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
