# Builds the site on every pull request and push to main, and publishes it
# to GitHub Pages (https://captf.io/) from main.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push to main is never cancelled mid-run, so a deploy in flight always
# finishes; only superseded pull request runs are cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every source file carries the Apache-2.0 license header; .licenserc.yaml
  # says which files need it.
  license-headers:
    runs-on:
      group: Bertha
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check license headers
        run: make check-headers ENGINE=docker

  build:
    runs-on:
      group: Bertha
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: tools/git_dates.py dates each page from it.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check the generated files are current
        run: |
          make gen
          git diff --exit-code || {
            echo "::error::make gen changed files: run it and commit the result"
            exit 1
          }
      # After the check above: this rewrites the pages' front matter.
      - name: Build the site, dated from git
        run: make build-pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [license-headers, build]
    runs-on:
      group: Bertha
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
